[project]
name = "olixops-agent"
version = "0.1.0"
description = "DevOps agent API and Pulumi orchestration backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "openai>=2,<3",
    "psycopg[binary,pool]>=3.3",
    "pulumi==3.261.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=6",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.12.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
